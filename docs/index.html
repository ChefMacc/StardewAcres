<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StardewAcres Sourdough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f2;--ink:#202a23;--green:#2f5d46;--crust:#8a5522;--line:#d5dacd;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Work Sans",system-ui,sans-serif}
main{max-width:34rem;margin:0 auto;padding:3rem 1.25rem 4rem}
h1{font:800 clamp(2.6rem,9vw,4rem)/1 Fraunces,Georgia,serif;margin:0 0 .6rem;color:var(--green);letter-spacing:-.02em}
.sub{margin:0 0 2rem;max-width:30rem}
form{background:var(--card);border:2px solid var(--green);border-radius:6px;padding:1.5rem;display:grid;gap:1.1rem}
label{display:grid;gap:.35rem;font-weight:600}
input,select{font:inherit;padding:.7rem .75rem;border:1.5px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--crust);outline-offset:2px}
button{font:600 1.05rem "Work Sans",sans-serif;padding:.9rem;border:0;border-radius:4px;background:var(--crust);color:#fff;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.msg{margin-top:1rem;padding:1rem;border-radius:4px;display:none}
.msg.ok{display:block;background:#e3efe6;border:1.5px solid var(--green)}
.msg.err{display:block;background:#f8e4df;border:1.5px solid #a33a26}
</style>
</head>
<body>
    <main>
        <h1>StardewAcres Sourdough</h1>
        <p class="sub">Baked Daily.  Visit our farm stand on County Road 10 or place an order at a dropoff site below.</p>
        <p class="sub">We currently accept cash or Venmo</p>
        <form id="f">
            <label>Your name <input name="name" required maxlength="100" autocomplete="name"></label>
            <label>Your email <input name="email" type="email" required maxlength="200" autocomplete="email"></label>
            <label>
                Pickup date and location
                <select name="pickup" id="pickup" required><option value="">Loading dates…</option></select>
            </label>
            <label>
                Number of loaves ($7.00 per loaf, pay on pickup)
                <select name="loaves" id="loaves" required></select>
            </label>
            <button id="go" type="submit" disabled>Place order</button>
        </form>
        <div id="msg" class="msg" role="status"></div>
    </main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {apiKey:"AIzaSyBEjPtKbWxUWdp1PtOWaLN3noMDLUXmyZ4",authDomain:"stardewacres.firebaseapp.com",projectId:"stardewacres",storageBucket:"stardewacres.firebasestorage.app",messagingSenderId:"573287846915",appId:"1:573287846915:web:465da6aefe4ca767b82a36",measurementId:"G-WB32BQRM51"};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const $ = id => document.getElementById(id);
const dates = {};
const pretty = d => new Date(d + "T12:00:00").toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
const today = () => { const t = new Date(); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); };

for (let i = 1; i <= 12; i++) $("loaves").add(new Option(i + (i === 1 ? " loaf" : " loaves"), i));

db.collection("pickupDates").where("date", ">=", today()).orderBy("date").get().then(snap => {
  const sel = $("pickup");
  sel.innerHTML = "";
  if (snap.empty) { sel.add(new Option("No pickup dates are open right now", "")); return; }
  sel.add(new Option("Choose a pickup date", ""));
  snap.forEach(doc => { const d = doc.data(); dates[doc.id] = d; sel.add(new Option(pretty(d.date) + " – " + d.location, doc.id)); });
  $("go").disabled = false;
}).catch(e => { $("pickup").innerHTML = "<option value=''>Couldn’t load dates</option>"; show("err", "We couldn’t load pickup dates. Please refresh and try again."); console.error(e); });

function show(kind, text) { const m = $("msg"); m.className = "msg " + kind; m.textContent = text; }

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, p = dates[f.pickup.value];
  if (!p) return show("err", "Choose a pickup date to continue.");
  $("go").disabled = true;
  try {
    await db.collection("orders").add({
      name: f.name.value.trim(), email: f.email.value.trim(),
      pickupId: f.pickup.value, pickupDate: p.date, location: p.location,
      loaves: Number(f.loaves.value),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    show("ok", "Order placed! " + f.loaves.value + " × sourdough for " + pretty(p.date) + " at " + p.location + ".");
    f.reset();
  } catch (err) {
    console.error(err);
    show("err", "Your order didn’t go through. Please try again.");
  }
  $("go").disabled = false;
});
</script>
</body>
</html>
